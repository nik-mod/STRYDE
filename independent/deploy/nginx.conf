limit_req_zone $binary_remote_addr zone=commerce:10m rate=30r/m;
server {
  listen 8080;
  client_max_body_size 32k;
  # Only Caddy reaches this private container. Restore the actual client IP.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  location /api/ {
    limit_req zone=commerce burst=15 nodelay;
    limit_req_status 429;
    proxy_pass http://storefront:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  location / {
    proxy_pass http://storefront:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
